<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayerLab — Custom 3D Prints</title>
    
    <!-- Vector Core Icon & Design Pack Assets Link -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        :root {
            --neon-blue: #00f2fe;
            --dark-card: #18181b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            color: #ffffff;
            overflow-x: hidden;
        }
        .announcement-bar {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            text-align: center;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(11, 11, 15, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #27272a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .logo span { color: var(--neon-blue); }
        .categories span { margin-right: 20px; color: #a1a1aa; font-size: 0.95rem; cursor: pointer; transition: color 0.2s; }
        .categories span:hover { color: #fff; }
        
        .hero { max-width: 800px; margin: 60px auto 30px auto; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 15px; background: linear-gradient(to right, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .typewriter-container { font-size: 1.25rem; color: #a1a1aa; height: 30px; margin-bottom: 30px; font-family: monospace; }
        .cursor { color: var(--neon-blue); animation: blink 0.7s infinite; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }

        .btn-black { background-color: #fff; color: #000; padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-black:hover { background-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); transform: translateY(-2px); }
        .btn-outline { background-color: transparent; color: #fff; border: 1px solid #27272a; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .btn-outline:hover { background: #18181b; border-color: #52525b; }

        /* Stable Grid Arrangement Framework Layout */
        .main-layout {
            display: flex;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            gap: 30px;
        }
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
        }
        .catalog-section { flex: 3; }
        .cart-sidebar {
            flex: 1;
            background: var(--dark-card);
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
        
        .product-card { 
            background: var(--dark-card); 
            border-radius: 16px; 
            border: 1px solid #27272a; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-blue);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.15);
        }

        .product-image-container {
            width: 100%;
            height: 180px;
            background-color: #0b0b0f;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #27272a;
        }
        .product-image-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .product-card:hover .product-image-container img { transform: scale(1.06); }

        .product-card h3 { margin: 0 0 8px 0; font-size: 1.25rem; color: #fff; font-weight: 600; }
        .product-card p { margin: 0 0 15px 0; color: #a1a1aa; font-size: 0.9rem; line-height: 1.45; }
        .price-row { display: flex; gap: 10px; align-items: center; margin: 15px 0; }
        .current-price { font-size: 1.35rem; font-weight: bold; color: #fff; }
        
        .btn-add-cart { background: transparent; color: #fff; border: 1px solid #fff; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; }
        .btn-add-cart:hover { background: #fff; color: #000; }
        
        .owner-box { display: none; background: rgba(255, 153, 0, 0.1); border: 1px dashed #ff9900; padding: 10px; margin-top: 15px; border-radius: 8px; text-align: center; }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #27272a; padding: 12px 0; font-size: 0.95rem; color: #e4e4e7; }
        
        .payment-methods-box {
            margin-top: 20px;
            background: #0b0b0f;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 14px;
        }
        .payment-methods-box h4 { margin: 0 0 10px 0; font-size: 0.8rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; }
        .payment-icons { display: flex; gap: 15px; font-size: 1.25rem; color: #fff; margin-bottom: 12px; }
        .payment-icons i { transition: color 0.2s; }
        .payment-icons i:hover { color: var(--neon-blue); }
        .payment-select {
            width: 100%;
            padding: 10px;
            background: #18181b;
            color: white;
            border: 1px solid #27272a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            outline: none;
        }

        .checkout-btn { background: linear-gradient(90deg, #00f2fe, #4facfe); color: #000; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
        .checkout-btn:hover { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); opacity: 0.95; }
        footer { border-top: 1px solid #27272a; padding: 40px; margin-top: 80px; text-align: center; color: #71717a; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="announcement-bar">MADE TO ORDER · SHIPS IN 48 HOURS ANYWHERE IN INDIA</div>

    <nav>
        <div class="logo"><span>L</span> LayerLab</div>
        <div class="categories"><span>All products</span> <span>🪴 Planters</span> <span>🖥 Desk & Tech</span></div>
        <div style="font-weight: 600; font-size: 1rem;">🛒 Items: <span id="cart-counter" style="background:var(--neon-blue); color:#000; padding:2px 8px; border-radius:12px;">0</span></div>
    </nav>

    <div class="hero">
        <div id="adminNotice" style="display:none; background:#2ea44f; color:#fff; padding:12px; border-radius:6px; margin-bottom:20px; font-weight:bold; text-align:center; box-shadow: 0 0 15px rgba(46,164,79,0.3);">
            🔓 Welcome back, Owner. Dynamic edit tools unlocked.
        </div>
        <h1>Printed for you, priced for every desk.</h1>
        <div class="typewriter-container"><span id="typewriter-text"></span><span class="cursor">|</span></div>
        <div class="hero-btns">
            <button class="btn-black">Shop the catalogue</button>
            <button class="btn-outline" id="loginBtn" onclick="handleOwnerLogin()">Owner sign in</button>
        </div>
    </div>

    <!-- Main Structural Core Wrapper Layout -->
    <div class="main-layout">
        <div class="catalog-section">
            <div class="grid">
                
                <!-- Product 1 Card Module -->
                <div class="product-card" id="p1">
                    <div>
                        <div class="product-image-container">
                            <img class="p-img" src="https://unsplash.com" alt="Product Image">
                        </div>
                        <h3 class="title">Custom Name Keychain</h3>
                        <p>Personalised, practical and made to order.</p>
                        <div class="price-row"><div class="current-price price">₹299</div></div>
                    </div>
                    <div>
                        <button class="btn-add-cart" onclick="addToCart('Custom Name Keychain', 299)">Add to cart</button>
                        <div class="owner-box"><button onclick="editProduct('p1')" style="width:100%; padding:8px; background:#0366d6; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Modify Card</button></div>
                    </div>
                </div>

                <!-- Product 2 Card Module -->
                <div class="product-card" id="p2">
                    <div>
                        <div class="product-image-container">
